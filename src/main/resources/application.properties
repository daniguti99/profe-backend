spring.application.name=profe-backend

spring.datasource.url=jdbc:mysql://localhost:3306/profe_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expirationMs=3600000

# Subida de la foto de perfil (multipart). El límite del contenedor va por encima del
# validado en el servicio, para que un archivo de más de 2 MB caiga en su 400 específico.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Credenciales de Cloudinary (cloudinary://<api_key>:<api_secret>@<cloud_name>).
# Obligatoria: sin ella el backend no arranca, igual que con JWT_SECRET.
cloudinary.url=${CLOUDINARY_URL}

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Documentación OpenAPI (Swagger UI en /swagger-ui.html, contrato JSON en /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list

