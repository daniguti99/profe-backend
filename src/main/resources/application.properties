spring.application.name=profe-backend

spring.datasource.url=jdbc:mysql://localhost:3306/profe_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expirationMs=3600000

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Documentación OpenAPI (Swagger UI en /swagger-ui.html, contrato JSON en /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-order=Autenticación, Sesiones, Sesiones públicas, Unidades didácticas, Cursos, Ciclos, Exportación
springdoc.swagger-ui.doc-expansion=list
springdoc.packages-to-scan=com.daniel.profe.profe_backend.infraestructure.adapter.in.rest

